name: Build Android
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: unzip -o TopBins-android-project.zip -d project
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build test APKs
        working-directory: project
        run: gradle --no-daemon assembleFreeDebug assembleProDebug
      - name: Collect
        run: |
          mkdir out
          cp project/app/build/outputs/apk/free/debug/*.apk out/TopBins-free-test.apk
          cp project/app/build/outputs/apk/pro/debug/*.apk out/TopBins-pro-test.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Top Bins build ${{ github.run_number }}
          prerelease: true
          files: out/*
