name: Build Android
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: unzip -o TopBins-android-project.zip -d project
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build test APKs
        working-directory: project
        run: gradle --no-daemon assembleFreeDebug assembleProDebug
      - name: Load upload key
        env:
          KS: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "SIGNING_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "No upload key secret yet - skipping Play Store bundles"
          fi
      - name: Build Play Store bundles
        if: env.SIGNING_FILE != ''
        working-directory: project
        env:
          SIGNING_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
        run: gradle --no-daemon bundleFreeRelease bundleProRelease
      - name: Collect
        env:
          HAS_ADMOB: ${{ secrets.ADMOB_APP_ID != '' }}
        run: |
          mkdir out
          cp project/app/build/outputs/apk/free/debug/*.apk out/TopBins-free-test.apk
          cp project/app/build/outputs/apk/pro/debug/*.apk out/TopBins-pro-test.apk
          if [ -d project/app/build/outputs/bundle/freeRelease ]; then
            if [ "$HAS_ADMOB" = "true" ]; then F=TopBins-free-PLAYSTORE.aab; else F=TopBins-free-TESTADS-do-not-publish.aab; fi
            cp project/app/build/outputs/bundle/freeRelease/*.aab "out/$F"
            cp project/app/build/outputs/bundle/proRelease/*.aab out/TopBins-pro-PLAYSTORE.aab
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Top Bins build ${{ github.run_number }}
          prerelease: true
          files: out/*
